name: Notificări WorkTrack

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Trimite o notificare de test administratorului'
        type: boolean
        default: false

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalează firebase-admin
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Trimite notificările
        run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TZ: UTC
          WT_DEBUG: '1'
          WT_LOOP_MIN: ${{ github.event_name == 'schedule' && '58' || '0' }}
          WT_TEST_PUSH: ${{ inputs.test && '1' || '' }}
